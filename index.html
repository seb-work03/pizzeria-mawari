  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; }
    h1 {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
    }
    #pdf-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
    }
    #pdf-container canvas {
      width: 100%;
      max-width: 900px;
      display: block;
    }
    #loading {
      color: #fff;
      text-align: center;
      padding: 40px 20px;
      font-family: sans-serif;
      font-size: 1rem;
    }
    #download-link {
      display: none;
      color: #e63946;
      text-align: center;
      padding: 20px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <h1>Menù Pizzeria Mawari</h1>
  <div id="loading">Caricamento menù…</div>
  <div id="pdf-container"></div>
  <p id="download-link">
    <a href="menu.pdf">Scarica il menù in PDF</a>
  </p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function renderPage(pdf, pageNum, canvas) {
      const page = await pdf.getPage(pageNum);
      const dpr = window.devicePixelRatio || 1;
      const baseWidth = Math.min(window.innerWidth, 900);
      const scale = (baseWidth / page.getViewport({ scale: 1 }).width) * dpr;
      const viewport = page.getViewport({ scale });

      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = (viewport.width / dpr) + 'px';
      canvas.style.height = (viewport.height / dpr) + 'px';
      canvas.dataset.rendered = 'true';

      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    }

    async function renderPDF() {
      const container = document.getElementById('pdf-container');
      const loading = document.getElementById('loading');

      try {
        const pdf = await pdfjsLib.getDocument({ url: 'menu.pdf', cMapUrl: null }).promise;
        loading.style.display = 'none';

        const dpr = window.devicePixelRatio || 1;
        const baseWidth = Math.min(window.innerWidth, 900);
        const firstPage = await pdf.getPage(1);
        const firstViewport = firstPage.getViewport({ scale: baseWidth / firstPage.getViewport({ scale: 1 }).width });
        const pageHeight = firstViewport.height;

        // Crea placeholder per tutte le pagine
        const canvases = [];
        for (let i = 1; i <= pdf.numPages; i++) {
          const canvas = document.createElement('canvas');
          canvas.style.width = baseWidth + 'px';
          canvas.style.height = pageHeight + 'px';
          canvas.style.background = '#2a2a2a';
          canvas.dataset.page = i;
          container.appendChild(canvas);
          canvases.push(canvas);
        }

        // Renderizza prima pagina subito
        await renderPage(pdf, 1, canvases[0]);

        // Lazy load le altre con IntersectionObserver
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const canvas = entry.target;
              if (!canvas.dataset.rendered) {
                renderPage(pdf, parseInt(canvas.dataset.page), canvas);
              }
              observer.unobserve(canvas);
            }
          });
        }, { rootMargin: '200px' });

        canvases.slice(1).forEach(c => observer.observe(c));

      } catch (e) {
        loading.textContent = 'Impossibile caricare il menù.';
        document.getElementById('download-link').style.display = 'block';
      }
    }

    renderPDF();
  </script>
</body>
